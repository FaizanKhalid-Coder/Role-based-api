<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Role Based API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-badge">new identity</div>
      <h1>Create account</h1>
      <p class="auth-sub">Every new account starts with the <span class="mono">user</span> role.</p>

      <div class="alert alert-error" id="errorAlert"></div>
      <div class="alert alert-ok" id="okAlert"></div>

      <form id="registerForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="jane_doe" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>
      </form>

      <p class="auth-switch">Already registered? <a href="index.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
